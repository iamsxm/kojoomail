name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run build

      # 先编译检查，别把 Rust 错误拖到 20 分钟的打包步骤才暴露
      - name: Cargo check
        run: cargo check --workspace --all-targets
        working-directory: src-tauri

      - name: Build MCP stdio bridge
        run: cargo build --release -p kojoomail-mcp
        working-directory: src-tauri

      # 没有更新签名私钥，关掉 updater 产物
      - name: Build NSIS installer
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: kojoomail-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/kojoomail.exe
            src-tauri/target/release/kojoomail-mcp.exe
          if-no-files-found: error
